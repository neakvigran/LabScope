[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labscope"
version = "0.1.0"
description = "Scoped lab reconnaissance and change detection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
labscope = "labscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
